<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Redes · MYA Equipamientos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    .card { transition: transform .2s, box-shadow .2s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
    .photo-wrap { cursor: pointer; }
    .photo-wrap .cam-overlay { opacity: 0; transition: opacity .2s; }
    .photo-wrap:hover .cam-overlay { opacity: 1; }
    .social-link { transition: transform .15s; display: inline-flex; }
    .social-link:hover { transform: scale(1.15); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

<!-- ── Header ──────────────────────────────────────────── -->
<header class="bg-gradient-to-r from-slate-900 to-blue-900 text-white shadow-xl">
  <div class="max-w-screen-xl mx-auto px-5 py-4 flex items-center justify-between gap-4 flex-wrap">
    <div>
      <h1 class="text-xl font-bold tracking-tight">Panel Redes Sociales</h1>
      <p class="text-slate-300 text-xs mt-0.5">M&A Equipamientos Comerciales</p>
    </div>
    <div id="stats-bar" class="flex flex-wrap gap-3 text-xs text-slate-300">
      <span id="stat-total"></span>
      <span id="stat-ig" class="text-pink-300"></span>
      <span id="stat-tt" class="text-slate-300"></span>
      <span id="stat-fb" class="text-blue-300"></span>
      <span id="stat-warn" class="text-red-300"></span>
    </div>
  </div>
</header>

<!-- ── Tabs ───────────────────────────────────────────────── -->
<div class="max-w-screen-xl mx-auto px-4 pt-4 pb-2">
  <div class="flex gap-1">
    <button id="tab-vendedores" onclick="setTab('vendedores')"
      class="tab-btn px-4 py-2 text-sm font-semibold rounded-t-xl border-b-2 border-blue-500 text-blue-600 bg-white transition-colors">
      <i class="fas fa-users mr-1.5"></i>Vendedores
    </button>
    <button id="tab-resumen" onclick="setTab('resumen')"
      class="tab-btn px-4 py-2 text-sm font-semibold rounded-t-xl border-b-2 border-transparent text-slate-400 hover:text-slate-600 bg-slate-100 hover:bg-white transition-colors">
      <i class="fas fa-chart-bar mr-1.5"></i>Resumen
    </button>
  </div>
</div>

<!-- ── Vista Vendedores ───────────────────────────────────── -->
<div id="vista-vendedores" class="max-w-screen-xl mx-auto px-4">

  <!-- Filtros -->
  <div class="bg-white rounded-2xl shadow-sm px-4 py-3 flex flex-wrap gap-3 items-center mb-4">
    <div class="relative min-w-48 flex-1">
      <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
      <input id="search" type="text" placeholder="Buscar vendedor..."
        class="w-full pl-8 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300">
    </div>
    <select id="filter-area"
      class="py-2 px-3 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300 bg-white">
      <option value="">Todas las sucursales</option>
    </select>
    <select id="filter-fuerza"
      class="py-2 px-3 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300 bg-white">
      <option value="">Todas las fuerzas</option>
    </select>
    <select id="filter-red"
      class="py-2 px-3 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300 bg-white">
      <option value="">Todas las redes</option>
      <option value="instagram">Con Instagram</option>
      <option value="tiktok">Con TikTok</option>
      <option value="facebook">Con Facebook</option>
      <option value="completo">Completos (3 redes)</option>
      <option value="incompleto">Incompletos</option>
      <option value="sin-redes">Sin redes</option>
    </select>
    <span id="count" class="text-xs text-slate-400 ml-auto whitespace-nowrap"></span>
  </div>

  <!-- Grid -->
  <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 pb-10"></div>
  <div id="loading" class="flex flex-col items-center py-20 text-slate-400 gap-3">
    <i class="fas fa-spinner fa-spin text-4xl text-blue-400"></i>
    <p class="text-sm">Cargando vendedores...</p>
  </div>
</div>

<!-- ── Vista Resumen ──────────────────────────────────────── -->
<div id="vista-resumen" class="hidden max-w-screen-xl mx-auto px-4 pb-10">
  <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
    <table class="w-full text-sm">
      <thead>
        <tr class="bg-slate-50 border-b border-slate-200">
          <th class="text-left px-5 py-3 font-semibold text-slate-600">Sucursal</th>
          <th class="text-center px-4 py-3 font-semibold text-slate-600">Total</th>
          <th class="text-center px-4 py-3 font-semibold text-pink-500"><i class="fab fa-instagram"></i> Instagram</th>
          <th class="text-center px-4 py-3 font-semibold text-slate-700"><i class="fab fa-tiktok"></i> TikTok</th>
          <th class="text-center px-4 py-3 font-semibold text-blue-500"><i class="fab fa-facebook"></i> Facebook</th>
          <th class="text-center px-4 py-3 font-semibold text-red-400">Sin redes</th>
        </tr>
      </thead>
      <tbody id="resumen-body"></tbody>
    </table>
  </div>
</div>

<!-- ── Upload input ─────────────────────────────────────── -->
<input type="file" id="file-input" accept="image/*" class="hidden">

<!-- ── Embed Modal ───────────────────────────────────────── -->
<div id="embed-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="closeModal()"></div>
  <div class="relative bg-slate-900 rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">
    <!-- Header -->
    <div id="modal-header" class="flex items-center gap-3 px-4 py-3 border-b border-slate-700">
      <i id="modal-icon" class="text-lg"></i>
      <div>
        <p id="modal-name" class="text-white text-sm font-semibold"></p>
        <p id="modal-handle" class="text-slate-400 text-xs"></p>
      </div>
      <button onclick="closeModal()" class="ml-auto text-slate-400 hover:text-white transition-colors">
        <i class="fas fa-times text-lg"></i>
      </button>
    </div>
    <!-- iFrame -->
    <div class="relative bg-slate-800" style="height:520px">
      <div id="modal-loading" class="absolute inset-0 flex items-center justify-center text-slate-400">
        <i class="fas fa-spinner fa-spin text-2xl"></i>
      </div>
      <iframe id="embed-iframe" src="" class="w-full h-full border-0"
              onload="document.getElementById('modal-loading').style.display='none'"></iframe>
    </div>
    <!-- Footer -->
    <div class="px-4 py-3 border-t border-slate-700 flex items-center">
      <a id="modal-link" href="#" target="_blank"
         class="flex items-center gap-1.5 text-xs text-blue-400 hover:text-blue-300">
        <i class="fas fa-external-link-alt"></i> Abrir perfil
      </a>
    </div>
  </div>
</div>

<!-- ── Toast ────────────────────────────────────────────── -->
<div id="toast" class="fixed bottom-5 right-5 hidden bg-slate-800 text-white text-sm px-4 py-2.5 rounded-xl shadow-xl"></div>

<script>
// ── Firebase ────────────────────────────────────────────────
firebase.initializeApp({
  apiKey: "AIzaSyClY_ZLLbikl_iQo69DnooLiFlFZ9aXB1M",
  authDomain: "geotracker-ce9e4.firebaseapp.com",
  projectId: "geotracker-ce9e4",
  messagingSenderId: "423169527584",
  appId: "1:423169527584:web:c3cd6d9683c5b6f97a5145",
});
const db   = firebase.firestore();
const auth = firebase.auth();
auth.signInAnonymously().catch(() => {});

// ── Cloudinary ──────────────────────────────────────────────
const CLOUDINARY_CLOUD  = 'dfkfggvhz';
const CLOUDINARY_PRESET = 'x5gqnsmf';

// ── Config ──────────────────────────────────────────────────
const SHEET_ID  = '1VNDYPC2Uw3Yq856In5hpdfR0ZrmuOWnZov4_LwXF79s';
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;

const AREA_COLORS = {
  'SALTA':            'bg-purple-100 text-purple-800',
  'JUJUY':            'bg-sky-100 text-sky-800',
  'SANTIAGO':         'bg-green-100 text-green-800',
  'NORTE INTERIOR':   'bg-amber-100 text-amber-800',
  'NORTE CENTR':      'bg-orange-100 text-orange-800',
  'TUCUMAN CAPITAL':  'bg-red-100 text-red-800',
  'TUCUMAN INTERIOR': 'bg-rose-100 text-rose-800',
  'LA RIOJA':         'bg-indigo-100 text-indigo-800',
  'CATAMARCA':        'bg-teal-100 text-teal-800',
  'CORDOBA':          'bg-cyan-100 text-cyan-800',
};

// ── State ───────────────────────────────────────────────────
let allVendors = [];
let photos     = {};    // key → url
let lastPosts  = {};    // key → { instagram, tiktok, facebook }
let uploadKey  = null;

// ── Helpers ─────────────────────────────────────────────────
function vendorKey(nombre) {
  return (nombre || '').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
}

function extractHandle(url) {
  if (!url) return null;
  const clean = url.replace(/\?.*$/, '').replace(/\/$/, '');
  return clean.split('/').pop() || null;
}

function timeAgo(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d)) return null;
  const days = Math.floor((Date.now() - d) / 86400000);
  if (days === 0) return 'hoy';
  if (days === 1) return 'ayer';
  if (days < 7)  return `${days}d`;
  if (days < 30) return `${Math.floor(days/7)}sem`;
  if (days < 365)return `${Math.floor(days/30)}m`;
  return '+1 año';
}

function dateColor(dateStr) {
  if (!dateStr) return 'text-slate-300';
  const days = Math.floor((Date.now() - new Date(dateStr)) / 86400000);
  if (days <= 7)  return 'text-green-600 font-semibold';
  if (days <= 30) return 'text-yellow-500 font-semibold';
  return 'text-red-500 font-semibold';
}

function initials(nombre) {
  return (nombre || '').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

function showToast(msg, error = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `fixed bottom-5 right-5 text-sm px-4 py-2.5 rounded-xl shadow-xl text-white ${error ? 'bg-red-600' : 'bg-slate-800'}`;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 3000);
}

// ── Load data ────────────────────────────────────────────────
function loadVendors() {
  return new Promise(resolve => {
    Papa.parse(SHEET_URL, {
      download: true, header: true, skipEmptyLines: true,
      complete: r => resolve(r.data),
      error: () => resolve([]),
    });
  });
}

async function loadPhotos() {
  try {
    const snap = await db.collection('redesPhotos').get();
    snap.forEach(doc => { photos[doc.id] = doc.data().url; });
  } catch(e) {}
}

async function loadLastPosts() {
  try {
    const snap = await db.collection('redesLastPosts').get();
    snap.forEach(doc => { lastPosts[doc.id] = doc.data(); });
  } catch(e) {}
}

// ── Card ─────────────────────────────────────────────────────
function embedUrl(url) {
  if (!url) return null;
  if (url.includes('instagram.com')) {
    const user = extractHandle(url);
    return user ? `https://www.instagram.com/${user}/embed/` : null;
  }
  // TikTok no soporta embed de perfiles (solo videos individuales)
  return null;
}

function socialRow(iconClass, colorClass, url, lastPost, vendorName) {
  const handle  = extractHandle(url);
  const ago     = timeAgo(lastPost);
  const color   = dateColor(lastPost);
  const hasEmbed = !!embedUrl(url);

  if (!url) return `
    <div class="flex items-center gap-1.5 text-slate-200">
      <i class="${iconClass} text-xs w-3.5 text-center"></i>
      <span class="text-xs italic text-slate-300">—</span>
    </div>`;

  const handleClick = hasEmbed
    ? `onclick="openEmbed('${url}','${iconClass}','${colorClass}','${vendorName}','${handle}')" style="cursor:pointer"`
    : `onclick="window.open('${url}','_blank')" style="cursor:pointer"`;

  return `
    <div class="flex items-center gap-1.5 relative group/row">
      <a href="${url}" target="_blank" class="social-link ${colorClass}">
        <i class="${iconClass} text-xs w-3.5 text-center"></i>
      </a>
      <span class="text-xs truncate flex-1 max-w-20 text-blue-500 hover:text-blue-700 hover:underline"
            ${handleClick}>${handle.startsWith('@') ? handle : '@' + handle}</span>
      <span class="text-xs ${ago ? color : 'text-slate-300'}">${ago || '—'}</span>
      <!-- Tooltip -->
      <div class="absolute left-0 bottom-full mb-1.5 hidden group-hover/row:flex flex-col gap-1.5
                  bg-slate-900 text-white rounded-xl p-3 shadow-2xl z-50 w-64 border border-slate-700 pointer-events-none">
        <div class="flex items-center gap-2">
          <i class="${iconClass} ${colorClass} text-sm"></i>
          <span class="font-semibold text-sm">${handle.startsWith('@') ? handle : '@' + handle}</span>
          ${hasEmbed ? '<span class="ml-auto text-xs text-blue-400">click para preview</span>' : ''}
        </div>
        <p class="text-xs text-slate-400 break-all leading-relaxed">${url}</p>
      </div>
    </div>`;
}

function renderCard(v) {
  const key    = vendorKey(v['Nombre completo']);
  const photo  = photos[key];
  const posts  = lastPosts[key] || {};
  const area   = (v['Area'] || '').trim();
  const nombre = (v['Nombre completo'] || '').trim();
  const ig     = (v['Instagram'] || '').trim();
  const tt     = (v['TikTok'] || '').trim();
  const fb     = (v['Fan Page'] || '').trim();
  const wa     = (v['Número de Whastapp Corporativo'] || '').trim();
  const fuerza = (v['Fuerza de Venta'] || '').trim();
  const badge  = AREA_COLORS[area] || 'bg-slate-100 text-slate-600';

  const displayName = nombre.split(/\s+/).slice(0, 3).join(' ');

  const photoHTML = photo
    ? `<img src="${photo}" class="w-full h-full object-cover" id="img-${key}" alt="${nombre}">`
    : `<span class="text-2xl font-bold text-slate-400" id="img-${key}">${initials(nombre)}</span>`;

  return `
    <div class="card bg-white rounded-2xl shadow-sm p-3 flex flex-col gap-2.5"
         data-key="${key}" data-area="${area}"
         data-ig="${!!ig}" data-tt="${!!tt}" data-fb="${!!fb}">

      <!-- Photo -->
      <div class="photo-wrap relative mx-auto" onclick="triggerUpload('${key}')">
        <div class="w-16 h-16 rounded-full overflow-hidden bg-slate-100 border-2 border-slate-200 flex items-center justify-center" id="photo-wrap-${key}">
          ${photoHTML}
        </div>
        <div class="cam-overlay absolute inset-0 rounded-full bg-black/50 flex items-center justify-center">
          <i class="fas fa-camera text-white text-sm"></i>
        </div>
        <div id="upload-spinner-${key}" class="hidden absolute inset-0 rounded-full bg-black/60 flex items-center justify-center">
          <i class="fas fa-spinner fa-spin text-white text-sm"></i>
        </div>
      </div>

      <!-- Name & Area -->
      <div class="text-center leading-tight">
        <p class="text-xs font-semibold text-slate-700">${displayName}</p>
        <span class="inline-block mt-1 px-2 py-0.5 rounded-full text-[10px] font-medium ${badge}">${area}</span>
        ${fuerza ? `<span class="inline-block mt-1 px-2 py-0.5 rounded-full text-[10px] font-medium bg-violet-100 text-violet-700">${fuerza}</span>` : ''}
      </div>

      <!-- Social -->
      <div class="flex flex-col gap-1 border-t border-slate-100 pt-2">
        ${socialRow('fab fa-instagram', 'text-pink-500 hover:text-pink-600', ig, posts.instagram, nombre)}
        ${socialRow('fab fa-tiktok',    'text-slate-700 hover:text-slate-900', tt, posts.tiktok, nombre)}
        ${socialRow('fab fa-facebook',  'text-blue-500 hover:text-blue-700', fb, posts.facebook, nombre)}
      </div>

      <!-- WhatsApp -->
      ${wa ? `
        <a href="https://wa.me/54${wa}" target="_blank"
           class="flex items-center justify-center gap-1.5 py-1 bg-green-50 hover:bg-green-100 text-green-700 rounded-lg text-xs font-medium transition-colors">
          <i class="fab fa-whatsapp"></i> ${wa}
        </a>` : ''}
    </div>`;
}

// ── Render list ───────────────────────────────────────────────
function renderAll() {
  const search = document.getElementById('search').value.toLowerCase();
  const area   = document.getElementById('filter-area').value;
  const red    = document.getElementById('filter-red').value;

  const fuerza = document.getElementById('filter-fuerza').value;

  const filtered = allVendors.filter(v => {
    const nombre  = (v['Nombre completo'] || '').toLowerCase();
    const vArea   = (v['Area'] || '').trim();
    const vFuerza = (v['Fuerza de Venta'] || '').trim();
    const ig      = !!(v['Instagram'] || '').trim();
    const tt      = !!(v['TikTok'] || '').trim();
    const fb      = !!(v['Fan Page'] || '').trim();

    if (search && !nombre.includes(search) && !vArea.toLowerCase().includes(search)) return false;
    if (area && vArea !== area) return false;
    if (fuerza && vFuerza !== fuerza) return false;
    if (red === 'instagram'  && !ig) return false;
    if (red === 'tiktok'     && !tt) return false;
    if (red === 'facebook'   && !fb) return false;
    if (red === 'completo'   && !(ig && tt && fb)) return false;
    if (red === 'incompleto' && ig && tt && fb) return false;
    if (red === 'incompleto' && !ig && !tt && !fb) return false;
    if (red === 'sin-redes'  && (ig || tt || fb)) return false;
    return true;
  });

  document.getElementById('grid').innerHTML = filtered.map(renderCard).join('');
  document.getElementById('count').textContent = `${filtered.length} vendedor${filtered.length !== 1 ? 'es' : ''}`;
}

function buildAreaFilter() {
  const areas = [...new Set(allVendors.map(v => (v['Area'] || '').trim()).filter(Boolean))].sort();
  const sel = document.getElementById('filter-area');
  const countByArea = {};
  allVendors.forEach(v => {
    const a = (v['Area'] || '').trim();
    if (a) countByArea[a] = (countByArea[a] || 0) + 1;
  });
  areas.forEach(a => {
    const o = document.createElement('option');
    o.value = a; o.textContent = `${a} (${countByArea[a] || 0})`;
    sel.appendChild(o);
  });
}

function buildFuerzaFilter() {
  const fuerzas = [...new Set(allVendors.map(v => (v['Fuerza de Venta'] || '').trim()).filter(Boolean))].sort();
  const sel = document.getElementById('filter-fuerza');
  const count = {};
  allVendors.forEach(v => {
    const f = (v['Fuerza de Venta'] || '').trim();
    if (f) count[f] = (count[f] || 0) + 1;
  });
  fuerzas.forEach(f => {
    const o = document.createElement('option');
    o.value = f; o.textContent = `${f} (${count[f] || 0})`;
    sel.appendChild(o);
  });
}

function renderStats() {
  const n     = allVendors.length;
  const ig    = allVendors.filter(v => v['Instagram']).length;
  const tt    = allVendors.filter(v => v['TikTok']).length;
  const fb    = allVendors.filter(v => v['Fan Page']).length;
  const noRed = allVendors.filter(v => !v['Instagram'] && !v['TikTok'] && !v['Fan Page']).length;
  document.getElementById('stat-total').textContent = `👥 ${n} vendedores`;
  document.getElementById('stat-ig').textContent    = `📸 IG: ${ig}`;
  document.getElementById('stat-tt').textContent    = `🎵 TK: ${tt}`;
  document.getElementById('stat-fb').textContent    = `👍 FB: ${fb}`;
  if (noRed > 0) document.getElementById('stat-warn').textContent = `⚠️ Sin redes: ${noRed}`;
}

// ── Photo upload (Cloudinary) ─────────────────────────────────
window.triggerUpload = function(key) {
  uploadKey = key;
  document.getElementById('file-input').click();
};

document.getElementById('file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file || !uploadKey) return;

  const key     = uploadKey;
  const spinner = document.getElementById(`upload-spinner-${key}`);
  if (spinner) spinner.classList.remove('hidden');

  try {
    const form = new FormData();
    form.append('file', file);
    form.append('upload_preset', CLOUDINARY_PRESET);
    form.append('public_id', `redesVendedores/${key}_${Date.now()}`);

    const resp = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
      method: 'POST', body: form,
    });
    if (!resp.ok) throw new Error(await resp.text());
    const data = await resp.json();
    const url  = data.secure_url;

    await db.collection('redesPhotos').doc(key).set({ url, updatedAt: new Date().toISOString() });
    photos[key] = url;

    const wrap = document.getElementById(`photo-wrap-${key}`);
    if (wrap) wrap.innerHTML = `<img src="${url}" class="w-full h-full object-cover" id="img-${key}" alt="">`;

    showToast('Foto actualizada ✓');
  } catch(err) {
    console.error(err);
    showToast('Error al subir la foto.', true);
  }

  if (spinner) spinner.classList.add('hidden');
  e.target.value = '';
  uploadKey = null;
});

// ── Embed Modal ───────────────────────────────────────────────
window.openEmbed = function(url, iconClass, colorClass, nombre, handle) {
  const eUrl = embedUrl(url);
  if (!eUrl) return;

  document.getElementById('modal-icon').className     = `${iconClass} ${colorClass} text-lg`;
  document.getElementById('modal-name').textContent   = nombre;
  document.getElementById('modal-handle').textContent = handle.startsWith('@') ? handle : '@' + handle;
  document.getElementById('modal-link').href          = url;
  document.getElementById('modal-loading').style.display = '';
  document.getElementById('embed-iframe').src         = eUrl;
  document.getElementById('embed-modal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
};

window.closeModal = function() {
  document.getElementById('embed-modal').classList.add('hidden');
  document.getElementById('embed-iframe').src = '';
  document.body.style.overflow = '';
};

// ── Resumen por sucursal ──────────────────────────────────────
function renderResumen() {
  const areas = [...new Set(allVendors.map(v => (v['Area'] || '').trim()).filter(Boolean))].sort();
  const tbody = document.getElementById('resumen-body');

  const rows = areas.map(area => {
    const vends  = allVendors.filter(v => (v['Area'] || '').trim() === area);
    const total  = vends.length;
    const ig     = vends.filter(v => v['Instagram']).length;
    const tt     = vends.filter(v => v['TikTok']).length;
    const fb     = vends.filter(v => v['Fan Page']).length;
    const noRed  = vends.filter(v => !v['Instagram'] && !v['TikTok'] && !v['Fan Page']).length;

    const bar = (n, t, color) => {
      const pct = t ? Math.round(n / t * 100) : 0;
      return `<div class="flex items-center gap-1.5 justify-center">
        <span class="${n === t ? 'font-semibold' : ''}">${n}</span>
        <div class="w-10 h-1.5 bg-slate-100 rounded-full overflow-hidden">
          <div class="h-full ${color} rounded-full" style="width:${pct}%"></div>
        </div>
      </div>`;
    };

    return `<tr class="border-b border-slate-50 hover:bg-slate-50 cursor-pointer transition-colors"
                onclick="filtrarSucursal('${area}')">
      <td class="px-4 py-2.5 font-medium text-slate-700">${area}</td>
      <td class="px-3 py-2.5 text-center font-bold text-slate-800">${total}</td>
      <td class="px-3 py-2.5">${bar(ig, total, 'bg-pink-400')}</td>
      <td class="px-3 py-2.5">${bar(tt, total, 'bg-slate-600')}</td>
      <td class="px-3 py-2.5">${bar(fb, total, 'bg-blue-400')}</td>
      <td class="px-3 py-2.5 text-center ${noRed > 0 ? 'text-red-400 font-semibold' : 'text-slate-300'}">${noRed || '—'}</td>
    </tr>`;
  });

  // Fila total
  const tot   = allVendors.length;
  const totIg = allVendors.filter(v => v['Instagram']).length;
  const totTt = allVendors.filter(v => v['TikTok']).length;
  const totFb = allVendors.filter(v => v['Fan Page']).length;
  const totNo = allVendors.filter(v => !v['Instagram'] && !v['TikTok'] && !v['Fan Page']).length;

  rows.push(`<tr class="bg-slate-50 font-semibold text-slate-600 border-t border-slate-200">
    <td class="px-4 py-2.5">TOTAL</td>
    <td class="px-3 py-2.5 text-center text-slate-800">${tot}</td>
    <td class="px-3 py-2.5 text-center text-pink-500">${totIg}</td>
    <td class="px-3 py-2.5 text-center text-slate-700">${totTt}</td>
    <td class="px-3 py-2.5 text-center text-blue-500">${totFb}</td>
    <td class="px-3 py-2.5 text-center ${totNo > 0 ? 'text-red-400' : 'text-slate-300'}">${totNo || '—'}</td>
  </tr>`);

  tbody.innerHTML = rows.join('');
}

window.filtrarSucursal = function(area) {
  document.getElementById('filter-area').value = area;
  setTab('vendedores');
  renderAll();
};

window.setTab = function(tab) {
  const isVend = tab === 'vendedores';
  document.getElementById('vista-vendedores').classList.toggle('hidden', !isVend);
  document.getElementById('vista-resumen').classList.toggle('hidden', isVend);

  const activeClass   = ['border-blue-500', 'text-blue-600', 'bg-white'];
  const inactiveClass = ['border-transparent', 'text-slate-400', 'bg-slate-100'];

  const tVend = document.getElementById('tab-vendedores');
  const tRes  = document.getElementById('tab-resumen');

  activeClass.forEach(c => { tVend.classList.toggle(c, isVend);  tRes.classList.toggle(c, !isVend); });
  inactiveClass.forEach(c => { tVend.classList.toggle(c, !isVend); tRes.classList.toggle(c, isVend); });
};

// ── Init ──────────────────────────────────────────────────────
async function init() {
  const [vendors] = await Promise.all([loadVendors(), loadPhotos(), loadLastPosts()]);
  allVendors = vendors;

  const loading = document.getElementById('loading');
  if (loading) loading.remove();

  buildAreaFilter();
  buildFuerzaFilter();
  renderStats();
  renderResumen();
  renderAll();

  document.getElementById('search').addEventListener('input', renderAll);
  document.getElementById('filter-area').addEventListener('change', renderAll);
  document.getElementById('filter-fuerza').addEventListener('change', renderAll);
  document.getElementById('filter-red').addEventListener('change', renderAll);
}

init();
</script>
